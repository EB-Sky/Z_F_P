<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections | Zee Fashion Palace</title>
  <meta name="description" content="Browse bridal, evening, traditional, casual and menswear pieces from Zee Fashion Palace. All made to measure.">
  <meta name="theme-color" content="#1a1114">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-banner" style="background-image:url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1800&q=70')">
      <div class="container">
        <span class="eyebrow">Handmade to Measure</span>
        <h1>The Collections</h1>
        <div class="divider"></div>
        <p>Choose a piece you love as it is, or make it your own with your colours, fabric, and fit.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters" data-filters role="group" aria-label="Filter by category"></div>
        <div class="product-grid" data-products="all" aria-live="polite"></div>
      </div>
    </section>

    <section class="section section-dark cta-band pattern-bg">
      <div class="container reveal">
        <span class="eyebrow">Can't Find It?</span>
        <h2>Dream it, and we'll make it</h2>
        <p>Send us a picture or describe your idea. We'll design it from scratch, just for you.</p>
        <div class="btn-row">
          <a href="custom-order.html" class="btn btn-gold">Request a Custom Design</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
